name: Push Database Schema

on:
  workflow_dispatch:
    inputs:
      diagnostics_only:
        description: 'Only check connectivity; do not push database schema'
        type: boolean
        default: false
      audit_all_public_tables:
        description: 'Read-only access audit of every table in the public schema'
        type: boolean
        default: false

jobs:
  db-push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify diagnostic credential redaction
        run: npx --no-install vitest run scripts/check-db-connection.test.mjs scripts/prepare-db-ca.test.mjs scripts/push-db-schema.test.mjs scripts/compare-db-tables.test.mjs scripts/audit-db-access.test.mjs

      - name: Prepare trusted Supabase CA certificate
        env:
          SUPABASE_CA_CERT: ${{ secrets.SUPABASE_CA_CERT }}
        run: node scripts/prepare-db-ca.mjs

      - name: Check database connection (read-only)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/check-db-connection.mjs

      - name: Push Schema to Database
        if: ${{ !inputs.diagnostics_only }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/push-db-schema.mjs

      - name: Compare table names (read-only)
        if: ${{ inputs.diagnostics_only }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/compare-db-tables.mjs

      - name: Audit database role access (read-only)
        if: ${{ inputs.diagnostics_only }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUDIT_ALL_PUBLIC_TABLES: ${{ inputs.audit_all_public_tables }}
        run: node scripts/audit-db-access.mjs

      - name: Remove temporary CA certificate
        if: ${{ always() }}
        shell: bash
        run: |
          if [ -n "${DATABASE_CA_CERT_FILE:-}" ]; then
            rm -f -- "$DATABASE_CA_CERT_FILE"
          fi
